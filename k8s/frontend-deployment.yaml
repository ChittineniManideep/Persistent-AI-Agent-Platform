apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-frontend
  template:
    metadata:
      labels:
        app: agent-frontend
    spec:
      containers:
        - name: agent-frontend
          image: registry.example.com/agent-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_GATEWAY_WS_URL
              value: "wss://gateway.example.com/ws"
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://api.example.com"
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-frontend
spec:
  selector:
    app: agent-frontend
  ports:
    - port: 3000
      targetPort: 3000
